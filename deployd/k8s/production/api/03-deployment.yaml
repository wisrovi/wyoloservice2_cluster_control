# -------------------------------------------------------------
# Deployment for Cluster Admin API
# -------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-admin-api
  namespace: train-service
  labels:
    app.kubernetes.io/name: cluster-admin-api
    app.kubernetes.io/part-of: train-service2
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-admin-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-admin-api
        app.kubernetes.io/part-of: train-service2
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: neuralforge-cluster-admin-sa
      containers:
        - name: api
          image: wisrovi/train_service:cluster_admin_api_v3.2.4
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cluster-admin-api-config
            - secretRef:
                name: cluster-admin-api-secrets
          ports:
            - name: http-api
              containerPort: 8001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
