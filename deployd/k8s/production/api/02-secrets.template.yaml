# -------------------------------------------------------------
# Secrets Template for Cluster Admin API
# -------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: cluster-admin-api-secrets
  namespace: train-service
  labels:
    app.kubernetes.io/name: cluster-admin-api
    app.kubernetes.io/part-of: train-service2
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  JWT_SECRET_KEY: "<your_jwt_secret_key>"
  DEFAULT_ADMIN_USER: "<your_admin_user>"
  DEFAULT_ADMIN_PASSWORD: "<your_admin_password>"
