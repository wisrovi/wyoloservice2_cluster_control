# -------------------------------------------------------------
# Service and Ingress for Cluster Admin API
# -------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: cluster-admin-api-svc
  namespace: train-service
  labels:
    app.kubernetes.io/name: cluster-admin-api
    app.kubernetes.io/part-of: train-service2
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cluster-admin-api
  ports:
    - name: http-api
      port: 8001
      targetPort: 8001
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cluster-admin-api-ingress
  namespace: train-service
  labels:
    app.kubernetes.io/name: cluster-admin-api
    app.kubernetes.io/part-of: train-service2
    app.kubernetes.io/component: backend
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
spec:
  rules:
    - http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: cluster-admin-api-svc
                port:
                  number: 8001
          - path: /health
            pathType: Exact
            backend:
              service:
                name: cluster-admin-api-svc
                port:
                  number: 8001
