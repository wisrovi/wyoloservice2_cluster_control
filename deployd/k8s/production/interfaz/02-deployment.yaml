# -------------------------------------------------------------
# Deployment for Cluster Admin UI (VSCode Workbench SPA)
# -------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-admin-ui
  namespace: train-service
  labels:
    app.kubernetes.io/name: cluster-admin-ui
    app.kubernetes.io/part-of: train-service2
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-admin-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-admin-ui
        app.kubernetes.io/part-of: train-service2
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: ui
          image: wisrovi/train_service:cluster_admin_ui_v3.2.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cluster-admin-ui-config
          ports:
            - name: http-ui
              containerPort: 8501
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
